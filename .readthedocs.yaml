# Read the Docs configuration, see https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"          # the package supports 3.10 - 3.14 (pyproject.toml)
  apt_packages:
    - pandoc                # needed by nbsphinx to render the notebooks

sphinx:
  configuration: docs/source/conf.py

# conf.py imports vivid3d, so the package itself is built and installed together with the `docs` extra
# (pyproject.toml: [project.optional-dependencies] docs).
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
